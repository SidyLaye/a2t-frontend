# docker-compose.yml for a2t-frontend
# Usage: docker-compose up -d

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    expose:
      - "80"
    environment:
      - VITE_API_URL=${VITE_API_URL}
    restart: unless-stopped

  # Development service (uses Vite dev server)
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    command: npm run dev -- --host
    ports:
      - "5173:5173"
      - "5174:5174"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
    profiles:
      - dev
